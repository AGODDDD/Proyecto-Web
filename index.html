<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Olimpiadas PERÚ</title>
</head>
<body>
    <header>
        <img src="https://img.olympics.com/images/image/private/t_original_767-auto/f_auto/primary/iamkot1ddq9bobtib2fg" alt="Logo olimpiadas Perú">
    </header>

    <nav>
        <a href="#">Fútbol</a>
        <a href="#">Básquet</a>
        <a href="#">Vóley</a>
        <a href="#">Ping Pong</a>
    </nav>

    <section>
        <div>
            <h2 style="font-family: 'Courier New', Courier, monospace; color: crimson;">
                Registro de Institución y equipo
            </h2>
        </div>
    <form id="Formulario Registro" method="get">
        <div>
            <fieldset>
                <legend> Registro de Institución</legend>
            <label for="Institución">Nombre de Institución (*)</label>
            <input type="text" placeholder="Ej. I.E. San Miguel" required>
            <label for="RUC">RUC (*)</label>
            <input type="text" maxlength="11" minlength="11" placeholder="Ingrese RUC" required>
            <label for="Direc"> Dirección </label>
            <input type="text" size="40" placeholder="Ej. Av. Petit Thouars 6704" >
            </fieldset>
            <fieldset>
                <legend> Registro de Delegado</legend>
            <label for="Nomb">Delegado Responsable (*)</label>
            <input type="text" placeholder="Ingrese Nombre" required>
            <label for="DNI">DNI (*)</label>
            <input type="text" maxlength="8" minlength="8" placeholder="Ingrese DNI" required>
            <label for="email"> Correo Electronico (*) </label>
            <input type="text" size="40" placeholder="Ej. delegado@gmail.com" >
            <br><br>
            <label for="num"> Telefono (*) </label>
            <input type="text" maxlength="7" minlength="7" placeholder="Ej. 939867652" required>
            </fieldset>
            <fieldset>
                
            </fieldset>

        </div>

    </form>
    </section>

    <footer>
        <p>© 2026 Olimpiadas PERÚ</p>
    </footer>
</body>
</html>
